name: Project checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code quality
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

  database-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Run database tests
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup